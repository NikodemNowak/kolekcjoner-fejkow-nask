[project]
name = "fakecollector"
version = "0.1.0"
description = "Kolekcjoner Fejków"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.12",
    "streamlit>=1.40",
    "jinja2>=3.1",
    "duckdb>=1.1",
    "pyarrow>=18.0",
    "networkx>=3.4",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "tldextract>=5.1",
    "datasketch>=2.0.0",
    "imagehash>=4.3",
    "mmh3>=5.0",
    "stix2>=3.0",
    "numpy>=2.5.5",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
# Model extractors (workstream B); base install stays torch-free.
# GPU: also `uv pip install onnxruntime-gpu` so InsightFace uses CUDA.
ml = [
    "numpy>=1.26",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "torch>=2.6",
    "transformers>=4.49",
    "sentencepiece>=0.2",
    "insightface>=0.7.3",
    "onnxruntime>=1.20",
    "easyocr>=1.7",
    "faster-whisper>=1.1",
    "pdqhash>=0.2",
    "pypdfium2>=4.30",  # Apache-2.0 / BSD-3-Clause; renders page.pdf captures (not AGPL PyMuPDF)
    "httpx[http2]>=0.27",
]
# Optional dense text embeddings (`text.bge`, BAAI/bge-m3, ~2.2 GB of weights): kept out of
# `ml` so a normal install stays smaller; the jury image includes it.
bge = [
    "sentence-transformers>=3.3",
]
# Read-only JSON API for the Next.js UI in web/ (`fakecollector-web`).
web = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "pillow>=10.4",
]

[project.scripts]
fakecollector = "fakecollector.cli:app"
fakecollector-web = "fakecollector.api.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
    "fastapi>=0.115",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fakecollector"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PTH", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
