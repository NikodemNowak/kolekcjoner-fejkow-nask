# Web UI (Next.js). Reach it with `kubectl -n kolekcjoner port-forward svc/kf-web 3000:3000`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kf-web
  namespace: kolekcjoner
  labels: { app.kubernetes.io/name: kf-web, app.kubernetes.io/part-of: kolekcjoner-fejkow }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kf-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kf-web, app.kubernetes.io/part-of: kolekcjoner-fejkow }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: fakecollector-web:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: NEXT_TELEMETRY_DISABLED, value: "1" }
            # Optional access gate: create the secret to require a login (see README).
            - name: KF_DEMO_USER
              valueFrom: { secretKeyRef: { name: kf-web-auth, key: user, optional: true } }
            - name: KF_DEMO_PASSWORD
              valueFrom: { secretKeyRef: { name: kf-web-auth, key: password, optional: true } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kf-web
  namespace: kolekcjoner
spec:
  selector: { app.kubernetes.io/name: kf-web }
  ports: [{ name: http, port: 3000, targetPort: http }]
